; MCM default keybind assignments for fallout4access.
;
; Format: s<name>=keycode,modifiers
;   The leading 's' prefix is REQUIRED: Bethesda's Setting class infers the
;   value type from the first character of the setting name ('s' = string,
;   'i' = int, 'b' = bool, 'f' = float). Without 's', MCM silently treats
;   the setting as kType_Unknown and fails to register it.
;   keycode is a Windows Virtual Key (VK) code (see BS_BUTTON_CODE).
;   modifiers is a bitfield: 1=shift, 2=ctrl, 4=alt.
;
; User overrides go in Data\MCM\Settings\fallout4access.ini (written by MCM
; when the user remaps a key through the UI).

[Keybinds]
sScanObjects=101,0
sNextObject=34,0
sPrevObject=33,0
sNextCategory=34,1
sPrevCategory=33,1
sCycleSubcategory=35,0
sAnnounceObject=36,0
sWalkToObject=36,1
sAnnounceStats=72,0
sSwitchMenuSide=70,0
